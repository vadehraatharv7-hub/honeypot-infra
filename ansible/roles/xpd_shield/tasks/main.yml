---
- name: Check if Go is installed
  stat:
    path: /usr/local/go/bin/go
  register: go_bin

- name: Remove existing Go installation
  file:
    path: /usr/local/go
    state: absent

- name: Download and extract Go 1.27.1
  unarchive:
    src: "https://golang.org/dl/go1.27.1.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: yes

- name: Copy xpd-shield directory
  copy:
    src: "{{ playbook_dir }}/../../xpd-shield"
    dest: /opt/
    owner: root
    group: root

- name: Build xpd-shield
  command: /usr/local/go/bin/go build -o xpd-shield .
  args:
    chdir: /opt/xpd-shield
    creates: /opt/xpd-shield/xpd-shield

- name: Create xpd-shield service file
  template:
    src: xpd-shield.service.j2
    dest: /etc/systemd/system/xpd-shield.service
  notify: restart xpd-shield

- name: Ensure xpd-shield is enabled and started
  systemd:
    name: xpd-shield
    state: started
    enabled: yes
    daemon_reload: yes
