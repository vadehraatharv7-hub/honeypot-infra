---
- name: Install curl
  apt:
    name: curl
    state: present
    update_cache: yes

- name: Add Vector APT repository
  shell: curl -1sLf 'https://repositories.timber.io/public/vector/cfg/setup/bash.deb.sh' | sudo -E bash
  args:
    creates: /etc/apt/sources.list.d/timber-vector.list

- name: Install Vector
  apt:
    name: vector
    state: present
    update_cache: yes

- name: Ensure /etc/vector directory exists
  file:
    path: /etc/vector
    state: directory
    mode: '0755'

- name: Copy Vector configuration
  template:
    src: vector.toml.j2
    dest: /etc/vector/vector.toml
    mode: '0644'
  notify: Restart Vector

- name: Set Cosmos DB URI environment variable for Vector
  copy:
    dest: /etc/default/vector
    content: |
      COSMOS_DB_URI="{{ cosmos_db_uri }}"
  notify: Restart Vector

- name: Enable and start Vector service
  systemd:
    name: vector
    state: started
    enabled: yes
    daemon_reload: yes
