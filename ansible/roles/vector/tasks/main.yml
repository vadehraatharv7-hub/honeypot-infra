---
- name: Install curl
  apt:
    name: curl
    state: present
    update_cache: yes

- name: Install Vector via direct DEB package
  apt:
    deb: https://packages.timber.io/vector/0.38.0/vector_0.38.0-1_amd64.deb
    state: present

- name: Ensure /etc/vector directory exists
  file:
    path: /etc/vector
    state: directory
    mode: '0755'

- name: Copy Vector configuration
  template:
    src: vector.toml.j2
    dest: /etc/vector/vector.toml
    mode: '0644'
  notify: Restart Vector

- name: Set Cosmos DB URI environment variable for Vector
  copy:
    dest: /etc/default/vector
    content: |
      COSMOS_DB_URI="{{ cosmos_db_uri }}"
  notify: Restart Vector

- name: Enable and start Vector service
  systemd:
    name: vector
    state: started
    enabled: yes
    daemon_reload: yes
