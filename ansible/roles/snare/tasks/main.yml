---
- name: Ensure Docker and dependencies are installed
  apt:
    name: ['docker.io', 'docker-compose-v2', 'python3-docker', 'curl']
    state: present
    update_cache: yes

- name: Ensure Snare working directory exists
  file:
    path: /home/azureuser/snare
    state: directory
    owner: azureuser
    group: azureuser

- name: Create Tanner log directory writable by the container user
  file:
    path: /home/azureuser/snare/tanner_logs
    state: directory
    owner: root
    group: root
    mode: '0777'

- name: Deploy Snare & Tanner Docker Compose File
  copy:
    dest: /home/azureuser/snare/docker-compose.yml
    content: |
      services:
        tanner_redis:
          image: redis:alpine
          restart: always
        tanner:
          image: dtagdevsec/tanner:24.04
          restart: always
          volumes:
            - /home/azureuser/snare/tanner_logs:/tmp/tanner
          depends_on:
            - tanner_redis
        snare:
          image: dtagdevsec/snare:24.04
          restart: always
          ports:
            - "80:80"
          depends_on:
            - tanner
    owner: azureuser
    group: azureuser

- name: Start Snare & Tanner Stack
  community.docker.docker_compose_v2:
    project_src: /home/azureuser/snare
    state: present

- name: Install python3 for the log forwarder
  apt:
    name: python3
    state: present

- name: Remove the old bash forwarder
  file:
    path: /usr/local/bin/snare-forwarder.sh
    state: absent

- name: Deploy Snare log forwarder (reads Snare's access log, which carries the client IP)
  copy:
    src: snare-forwarder.py
    dest: /usr/local/bin/snare-forwarder.py
    mode: '0755'
  notify: Restart snare forwarder

- name: Deploy JSON Log Forwarder Service
  copy:
    dest: /etc/systemd/system/snare-forwarder.service
    content: |
      [Unit]
      Description=Snare to SecDash log forwarder
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/snare-forwarder.py
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  notify: Restart snare forwarder

- name: Enable and start Snare Forwarder service
  systemd:
    name: snare-forwarder
    state: started
    enabled: yes
    daemon_reload: yes