---
- name: Ensure Docker and dependencies are installed
  apt:
    name: ['docker.io', 'docker-compose-v2', 'python3-docker', 'curl']
    state: present
    update_cache: yes

- name: Ensure Snare working directory exists
  file:
    path: /home/azureuser/snare
    state: directory
    owner: azureuser
    group: azureuser

- name: Deploy Snare & Tanner Docker Compose File
  copy:
    dest: /home/azureuser/snare/docker-compose.yml
    content: |
      services:
        tanner_redis:
          image: redis:alpine
          restart: always
        tanner:
          image: dtagdevsec/tanner:24.04
          restart: always
          volumes:
            - /home/azureuser/snare/tanner_logs:/tmp/tanner
          depends_on:
            - tanner_redis
        snare:
          image: dtagdevsec/snare:24.04
          restart: always
          ports:
            - "80:80"
          depends_on:
            - tanner
    owner: azureuser
    group: azureuser

- name: Start Snare & Tanner Stack
  community.docker.docker_compose_v2:
    project_src: /home/azureuser/snare
    state: present

- name: Deploy JSON Log Forwarder script
  copy:
    dest: /usr/local/bin/snare-forwarder.sh
    mode: '0755'
    content: |
      #!/bin/bash
      tail -F /home/azureuser/snare/tanner_logs/tanner.log | grep --line-buffered 'Requested path' | while read -r line; do
        path=$(echo "$line" | awk -F'Requested path ' '{print $2}')
        # Use the client IP if the log line carries one; never invent one
        ip=$(echo "$line" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1)
        ip_field=""
        [ -n "$ip" ] && ip_field="\"src_ip\": \"$ip\", "
        json="{\"eventid\": \"snare.http.request\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", ${ip_field}\"src_port\": 80, \"dst_port\": 80, \"protocol\": \"HTTP\", \"input\": \"GET $path HTTP/1.1\"}"
        curl -m 2 -s -X POST "http://10.0.2.4:8081/api/ingest/stream?sensor=vm-snare" \
            -H "Content-Type: application/json" \
            -d "$json" > /dev/null
      done

- name: Deploy JSON Log Forwarder Service
  copy:
    dest: /etc/systemd/system/snare-forwarder.service
    content: |
      [Unit]
      Description=Snare Native JSON Forwarder
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/snare-forwarder.sh
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Snare Forwarder service
  systemd:
    name: snare-forwarder
    state: started
    enabled: yes
    daemon_reload: yes